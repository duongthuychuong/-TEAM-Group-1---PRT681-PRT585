services:
    frontend:
        build:
            context: .
            dockerfile: Dockerfile.frontend
        container_name: tasks-frontend
        ports:
            - "8080:80"
        depends_on:
            api:
                condition: service_healthy

    api:
        build:
            context: .
            dockerfile: Dockerfile.api
        container_name: tasks-api
        environment:
            ASPNETCORE_ENVIRONMENT: Development
            TASKS_CONNECTION_STRING: "Server=azure-sql-edge,1433;Database=TasksDb;User Id=sa;Password=${MSSQL_SA_PASSWORD:-TaskManager!Dev123};TrustServerCertificate=True;"
            Seq__ServerUrl: "http://seq:80"
            Temporal__TargetHost: "temporal:7233"
            Temporal__Namespace: "default"
            Temporal__TaskQueue: "tasks-email"
            Smtp__Host: "mailpit"
            Smtp__Port: "1025"
            Smtp__UseSsl: "false"
            Notifications__Recipient: "${NOTIFICATION_EMAIL:-developer@taskflow.local}"
            Exceptionless__ApiKey: "${EXCEPTIONLESS_API_KEY:-}"
            Exceptionless__ServerUrl: "${EXCEPTIONLESS_SERVER_URL:-https://collector.exceptionless.io}"
        ports:
            - "5080:8080"
        depends_on:
            azure-sql-edge:
                condition: service_healthy
            mailpit:
                condition: service_healthy
            temporal:
                condition: service_healthy
            seq:
                condition: service_started

    seq:
        image: datalust/seq:2026.1
        container_name: tasks-seq
        environment:
            ACCEPT_EULA: "Y"
            # Hash for the local-only password documented in README. Override in shared environments.
            SEQ_FIRSTRUN_ADMINPASSWORDHASH: "${SEQ_ADMIN_PASSWORD_HASH:-QEGkyOxAgnPtUDR6EsejLeY+zaF04io8oK1256XgdcFeAEhW8eO5Io0ecK+5bIpUh9l2fRCDTSVcNmaUJopAocdtQtCTFJnud5UqvVLFpIvG}"
        ports:
            - "5341:80"
        volumes:
            - seq-data:/data

    temporal:
        image: temporalio/temporal:1.9.1
        container_name: tasks-temporal
        command: server start-dev --ip 0.0.0.0 --db-filename /home/temporal/temporal.db
        ports:
            - "7233:7233"
            - "8233:8233"
        volumes:
            - temporal-data:/home/temporal
        healthcheck:
            test: ["CMD", "temporal", "operator", "cluster", "health", "--address", "localhost:7233"]
            interval: 5s
            timeout: 5s
            retries: 20
            start_period: 10s

    mailpit:
        image: axllent/mailpit:v1.31.2
        container_name: tasks-mailpit
        ports:
            - "1025:1025"
            - "8025:8025"
        healthcheck:
            test: ["CMD", "/mailpit", "readyz"]
            interval: 5s
            timeout: 3s
            retries: 20
            start_period: 5s

    azure-sql-edge:
        image: mcr.microsoft.com/azure-sql-edge:latest
        container_name: tasks-sql-edge
        platform: linux/arm64
        environment:
            ACCEPT_EULA: "Y"
            MSSQL_SA_PASSWORD: "${MSSQL_SA_PASSWORD:-TaskManager!Dev123}"
            MSSQL_PID: Developer
            MSSQL_AGENT_ENABLED: "TRUE"
            MSSQL_TELEMETRY_ENABLED: "FALSE"
        ports:
            - "1433:1433"
        volumes:
            - azure-sql-edge-data:/var/opt/mssql
        healthcheck:
            test: ["CMD-SHELL", "bash -c '</dev/tcp/localhost/1433'"]
            interval: 10s
            timeout: 5s
            retries: 20
            start_period: 20s

volumes:
    azure-sql-edge-data:
    seq-data:
    temporal-data:
